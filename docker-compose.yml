# FailProbe — Month 4 prod stack (PostgreSQL). Three services: db, api, dashboard.
# For the lightweight SQLite dev stack use: docker compose -f docker-compose.dev.yml up
#
# Note: the API resolves its database from FAILPROBE_DB_URL (see
# failprobe/storage/db.py), so the Postgres URL is passed via that variable —
# TASK_17's DATABASE_URL placeholder is intentionally superseded here.
services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: probe
      POSTGRES_PASSWORD: probe
      POSTGRES_DB: failprobe
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U probe -d failprobe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - FAILPROBE_DB_URL=postgresql+asyncpg://probe:probe@db:5432/failprobe
      - FAILPROBE_EMIT_CONSOLE=true
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      # Browser-side base URL; the dashboard fetches the API on the host port.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
