# Alembic configuration for FailProbe.
# Migration scripts live in failprobe/storage/migrations/.
[alembic]
script_location = failprobe/storage/migrations
prepend_sys_path = .
# Database URL is supplied at runtime by env.py (see ProbeConfig.db_url).
sqlalchemy.url =

[post_write_hooks]
# Format newly generated migration scripts with ruff.
hooks = ruff
ruff.type = console_scripts
ruff.entrypoint = ruff
ruff.options = format REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
