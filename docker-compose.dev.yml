# FailProbe — dev stack (SQLite). Self-hostable: no external services.
# Usage: docker compose -f docker-compose.dev.yml up --build
# The default docker-compose.yml is the Postgres prod stack (see TASK 17/18).
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      - FAILPROBE_DB_URL=sqlite+aiosqlite:////app/data/failprobe.db
      - FAILPROBE_EMIT_CONSOLE=true
    volumes:
      # Named volume keeps the SQLite DB across restarts and survives a rebuild.
      - probe-data:/app/data
    healthcheck:
      test:
        - "CMD"
        - "python"
        - "-c"
        - "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    ports:
      - "3000:3000"
    environment:
      # Browser-side base URL; the dashboard fetches the API on the host port.
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      api:
        condition: service_healthy

volumes:
  probe-data:
